# Deploys to Firebase project my-super-manager-app:
#   - the Cloud Functions of the modules enabled in insurance-core/.env.my-super-manager-app
#     (ENABLED_MODULES: auth -> members, tenants -> tenants, conversation -> webchat, conversationCleanup)
#   - Firestore rules and indexes
#   - Hosting: the staff web app and the customer chat page (insurance-core/web)
# Runs every test first and deploys nothing if one fails.
#
# Needs one repository secret, FIREBASE_SERVICE_ACCOUNT: the JSON key of a Google Cloud service
# account allowed to deploy (see insurance-core/README.md, "Deploy the auth module alone").
name: Deploy

on:
  workflow_dispatch:
    inputs:
      redeploy_functions:
        description: 'Functions to redeploy even if unchanged, comma separated (e.g. conversationCleanup). Repairs a deploy that stopped halfway, like a missing schedule.'
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - 'insurance-core/**'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: insurance-core
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Backend tests
        run: npm ci && npm test
      - name: Dashboard tests
        run: npm ci && npm test
        working-directory: insurance-core/dashboard
      - name: Web app build
        run: npm ci && npm run build
        working-directory: insurance-core/web

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: insurance-core
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install function dependencies
        run: npm ci
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy
        env:
          REDEPLOY: ${{ inputs.redeploy_functions }}
        # --only functions: every function index.js defines (the enabled modules'); unchanged ones are skipped.
        # Functions named in REDEPLOY are targeted explicitly (functions:<name>), which the CLI never skips.
        # --force: non-interactive (sets the Artifact Registry cleanup policy for function images).
        run: |
          targets="functions"
          if [ -n "$REDEPLOY" ]; then
            if ! printf '%s' "$REDEPLOY" | grep -Eq '^[A-Za-z0-9_]+(,[A-Za-z0-9_]+)*$'; then echo "Invalid function list: $REDEPLOY"; exit 1; fi
            targets=$(printf '%s' "$REDEPLOY" | sed 's/^/functions:/; s/,/,functions:/g')
          fi
          echo "Deploying: $targets,firestore,hosting"
          npx --yes firebase-tools@14 deploy --project my-super-manager-app --only "$targets,firestore,hosting" --non-interactive --force
